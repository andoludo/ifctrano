[project]
name = "ifctrano"
version = "0.11.0"
description = "Package for generating building energy simulation model from IFC"
authors = [
    { name = "Ando Andriamamonjy", email = "andoludovic.andriamamonjy@gmail.com" },
]
license = { text = "GPL V3" }
readme = "README.md"
keywords = [
    "BIM",
    "IFC",
    "energy simulation",
    "modelica",
    "building energy simulation",
    "buildings",
    "ideas",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "ifcopenshell>=0.8.1.post1,<0.9.0",
    "trano>=0.22.0,<0.23.0",
    "shapely>=2.0.7,<3.0.0",
    "typer>=0.19.2,<0.20.0",
    "vedo>=2025.5.3,<2026.0.0",
    "open3d>=0.19.0,<0.20.0",
    "linkml>=1.8.1,<1.10.0",
    "linkml-runtime>=1.8.1,<1.10.0",
]

[project.urls]
Repository = "https://github.com/andoludo/ifctrano"

[project.scripts]
ifctrano = "ifctrano.main:app"

[dependency-groups]
dev = [
    "mypy>=1.8.0,<2.0.0",
    "nox>=2023.4.22",
    "ruff>=0.3.0,<0.4.0",
    "pre-commit>=3.6.2,<4.0.0",
    "pandas-stubs>=2.2.0.240218,<3.0.0",
    "types-simplejson>=3.19.0.20240218,<4.0.0",
    "types-beautifulsoup4>=4.12.0.20240229,<5.0.0",
    "pytest-mongo>=3.1.0,<4.0.0",
    "networkx-stubs>=0.0.1,<0.0.2",
    "pytest-ordering>=0.6,<0.7",
    "types-pyyaml>=6.0.12.20240808,<7.0.0",
    "isort>=5.13.2,<6.0.0",
    "jsf>=0.11.2,<0.12.0",
    "black>=24.10.0,<25.0.0",
    "pytest>=7.4.3,<8.0.0",
    "deepdiff>=8.6.1,<9.0.0",
]
docs = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.5.42,<10.0.0",
    "mkdocstrings>=0.26.2,<0.27.0",
    "mkdocstrings-python>=1.12.2,<2.0.0",
    "markdown-include>=0.8.1,<0.9.0",
    "mkdocs-gen-files>=0.5.0,<0.6.0",
    "openai>=1.52.2,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ifctrano"]

[tool.mypy]
plugins = "pydantic.mypy"
packages = "ifctrano"

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
show_absolute_path = true
# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true
strict = true

exclude = [
    "test_*",
    "conftest.py",
]

[tool.ruff]
line-length = 120
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.isort]
skip = ["models"]

[tool.ruff.lint]
select = ["E", "W", "F", "B006","RUF","UP","SIM","FURB","PIE","PERF","C4","B","PL","S","C901","N","ANN", "ERA001", "PD"]
ignore = []
extend-ignore = ["ANN101","ANN102","S101","PLR2004","W291"]

fixable = ["ALL"]
unfixable = []
